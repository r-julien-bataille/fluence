<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
      name="viewport"
    >
    <meta content="#2563EB" name="theme-color">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="default" name="apple-mobile-web-app-status-bar-style">
    <meta content="Fluence" name="apple-mobile-web-app-title">
    <meta content="Fluence" name="application-name">
    <meta
      content="Application web d'entraînement et d'évaluation de la fluence de lecture du CE1 au CM2 selon le protocole officiel ELFE / Éduscol."
      name="description"
    >
    <title>Fluence - Entraînement à la lecture (ELFE / Éduscol)</title>
    <script>
    "use strict";
    try {
      const s = localStorage.getItem("FLUENCE_THEME");
      const theme =
        s === "ocean" || s === "sauge" || s === "indigo" || s === "corail"
          ? s
          : "ocean";
      document.documentElement.setAttribute("data-theme", theme);
      const colors = {
        corail: "#EA580C",
        indigo: "#4F46E5",
        ocean: "#2563EB",
        sauge: "#0D9488",
      };
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta && colors[theme]) {
        meta.setAttribute("content", colors[theme]);
      }
    } catch {
      // Ignorer si localStorage n'est pas accessible
    }
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      rel="preload"
    >
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      >
    </noscript>
  </head>
  <body
    class="min-h-screen bg-cream text-stone-800 antialiased selection:bg-primary-100 selection:text-primary-900"
  >
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
